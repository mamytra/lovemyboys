<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Д</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #fcc9dc, #d1fffb);
            font-family:'Fira Code',cursive;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .card {
            background:linear-gradient(135deg, #d1fffb, #fcc9dc);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 40px;
            max-width: 3500px;
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: -20px;
            left: -100px;
            right: -20px;
            bottom: -20px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20"><path fill="%23ffe4f0" d="M0 0h20v20H0z"/><circle fill="%23ffd6e7" cx="10" cy="10" r="8"/></svg>');
            z-index: -1;
        }
        h1 {
            color: #ff6b9d;
            margin-bottom: 20px;
        }
        p {
            color: #6a4c93;
            line-height: 1.6;
            font-size: 18px;
        }
        .qr-container {
            margin-top: 30px;
        }
        .hearts {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -2;
        }
        .heart {
            position: absolute;
            background: #f07f9b;
            border-radius: 80%;
            opacity: 0.7;
            animation: float 10s infinite;
        }
        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-100vh) rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="hearts" id="hearts"></div>
    <div class="card">
        <h1>For my beautiful boy❤️</h1>
 <p>И встретишь ты, когда не ждешь</p>
 <p>И обретешь, не там, где ищешь</p>
              <img src="photo.jpg" alt="Наше фото" class="card-image">
        <div class="qr-container">
            <img src="qr-code.png" alt="QR-код этой страницы" class="qr-code">
            <p class="qr-text">Отсканируй, чтобы увидеть открытку снова!</p>
            <p>С любовью, твоя Ви✨</p>
        </div>
    </div>
   
    <script>
        // Анимация плавающих сердечек
        const hearts = document.getElementById('hearts');
        for (let i = 0; i < 20; i++) {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.style.width = Math.random() * 10 + 10 + 'px';
            heart.style.height = heart.style.width;
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDelay = Math.random() * 5 + 's';
            hearts.appendChild(heart);
        }
    </script>
</body>
</html>
